[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fuel-card-doctor"
version = "1.0.0"
description = "Audit a fuel card transactions CSV export: over-tank fills, duplicate fills, odometer regression, implausible MPG, off-hours fills, non-fuel purchases, price mismatches, shared cards"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
fuel-card-doctor = "fuel_card_doctor:main_entry"

[tool.setuptools]
py-modules = ["fuel_card_doctor"]
